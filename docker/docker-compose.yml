services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openpims
      POSTGRES_PASSWORD: openpims
      POSTGRES_DB: openpims
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpims"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "openpims"
      RUSTFS_SECRET_KEY: "openpims"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/logs"
    volumes:
      - rustfs_logs:/logs
      - rustfs_data:/data
    command: server /data --console-address ":9001"

  rc:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 openpims openpims; do
        sleep 1;
      done;
      rc mb --ignore-existing local/openpims;
      "

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://openpims:openpims@postgres:5432/openpims"
      NEXTAUTH_SECRET: "docker-dev-secret-change-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      S3_ENDPOINT: "http://rustfs:9000"
      S3_ACCESS_KEY: "openpims"
      S3_SECRET_KEY: "openpims"
      S3_BUCKET: "openpims"
      S3_REGION: "us-east-1"
    depends_on:
      postgres:
        condition: service_healthy
      rc:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
